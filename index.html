      <p class="note">Cada jugador juega desde su casa con esta misma página abierta${ON.transport === 'p2p' ? ', sin necesidad de cuenta' : ''}. Cada uno ve las misiones de los demás, nunca la suya.</p>
      <div class="field"><label class="label" for="on-name">Tu nombre</label>
        <div class="inline"><input id="on-name" type="text" maxlength="16" value="${esc(ON.nm)}" data-online-name="1" placeholder="Cómo te verán los demás"></div></div>
      <div class="field"><span class="label">Crear</span>
        <div class="actions"><button type="button" class="btn primary big" data-action="on-create">Crear partida</button></div>
        <p class="note">Serás el anfitrión: la partida vive en tu pantalla, así que mantenla abierta mientras jugáis.</p></div>
      ${ON.transport === 'p2p' ? '' : `<div class="field"><span class="label">Partidas abiertas</span>
        ${games ? `<ul class="rows">${games}</ul>` : '<p class="note">Ahora mismo no hay ninguna. Cuando alguien cree una, aparecerá aquí.</p>'}</div>`}
      <div class="field"><label class="label" for="on-code">Unirse con código</label>
        <div class="inline"><input id="on-code" class="short" type="text" maxlength="4" value="${esc(ui.joinCode)}" data-join-code="1" placeholder="K3F9" autocomplete="off">
        <button type="button" class="btn" data-action="on-join">Unirme</button></div></div>
      ${ui.connecting ? waitHTML('Conectando…') : ''}
      ${ui.err ? `<p class="err">${esc(ui.err)}</p>` : ''}
      ${connHTML()}
    </section>`;
}

function homeHTML() {
  return `<section class="hero">
      <span class="meta">3–5 jugadores · Cooperativo · Dados y deducción</span>
      <h1>BLIND<span class="dot" aria-hidden="true"></span>SPOTS</h1>
      <p><span>Ves la misión de todos.</span> <span>Todos ven la tuya.</span> <span>Nadie ve la suya.</span></p>
      <div><div class="tabs" role="group" aria-label="Modo de juego">
        <button type="button" data-action="mode" data-m="local" aria-pressed="${ui.mode === 'local'}">En este dispositivo</button>
        <button type="button" data-action="mode" data-m="online" aria-pressed="${ui.mode === 'online'}">Online</button>
      </div></div>
    </section>
    <div class="setup">${ui.mode === 'online' ? onlineSetupHTML() : localSetupHTML()}${howtoPanel()}</div>`;
}

function rulesHTML() {
  return `<div class="overlay dim" data-action="rules-close-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="rules-title">
    <h2 id="rules-title">Reglas de BlindSpots</h2>
    <p>Juego cooperativo de dados y deducción para 3–5 jugadores. Cada jugador tiene una misión personal que no puede ver; los demás sí la ven y deben ayudarle con sus decisiones.</p>
    <h3>Objetivo</h3>
    <p>El equipo gana el nivel si al final todos han cumplido su misión. Si falla una sola, el equipo pierde el nivel y puede volver a intentarlo.</p>
    <h3>Misiones</h3>
    <p>Cada misión tiene uno o varios objetivos: condiciones sobre todos los dados que acumulas en la partida. Por ejemplo: «Ningún dado azul», «Exactamente 3 dados verdes», «Suma azul &gt; suma naranja» (solo cuentan los valores) o «Dados de exactamente 3 colores distintos» (solo cuenta cuántos colores tienes).</p>
    <h3>Una ronda</h3>
    <ul>
      <li>Quien reparte tira los dados del nivel (aquí, ${DICE_PER_COLOR} de cada color).</li>
      <li>Los divide en tantos grupos como jugadores. No hace falta que sean iguales.</li>
      <li>Empezando por su izquierda, cada jugador elige un grupo y se lo lleva. Quien reparte recibe el último.</li>
      <li>Los dados se añaden a la zona personal y cuentan para la misión final.</li>
    </ul>
    <p>Un nivel dura tantas rondas como jugadores; cada uno reparte una vez. Las misiones solo se comprueban al final.</p>
    <h3>Comunicación</h3>
    <p>Se puede hablar y sugerir («creo que ese grupo te va mejor», «ese dado puede ser peligroso para alguien»), pero no revelar la misión de nadie.</p>
    <h3>Ajustes de la partida</h3>
    <ul>
      <li>Colores: con 3 se juega con azul, naranja y verde; con 4 entra el morado y con 5 el amarillo.</li>
      <li>Objetivos por jugador: la misión de cada jugador tiene de 1 a 3 objetivos y hay que cumplirlos todos.</li>
      <li>Dificultad: cada objetivo tiene de 1 a 5 estrellas. Se eligen las dificultades que se quieran y los objetivos se reparten al azar entre los que las tienen.</li>
    </ul>
    <h3>En esta versión</h3>
    <p>En un dispositivo, la web pide pasarlo antes de cada decisión y solo entonces muestra las misiones de los demás. Online, cada jugador ve las misiones de los demás en su pantalla. Los bots reparten pensando en las misiones que ven y, al elegir, cogen el grupo que menos perjudica al resto.</p>
    <div class="actions"><button type="button" class="btn primary" data-action="rules-close">Cerrar</button></div>
  </div></div>`;
}

function syncUiKey() {
  const k = stateKey();
  if (ui.key === k) return;
  const wasGroup = ui.key && ui.key.endsWith('|group');
  ui.key = k;
  ui.assign = {};
  G.roll.forEach(d => { ui.assign[d.id] = -1; });
  ui.sel = 0; ui.chosen = null; ui.hint = null; ui.pending = null;
  animate = G.phase === 'group' && !wasGroup;
}

function render() {
  const active = document.activeElement;
  const focusId = active && active.id;
  const caret = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  let html;
  if (G) { syncUiKey(); html = gameHTML(); }
  else if (ON.role) html = waitingRoomHTML();
  else html = homeHTML();
  $app.innerHTML = html + (ui.rules ? rulesHTML() : '');
  animate = false;
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) { el.focus(); if (caret !== null && typeof el.setSelectionRange === 'function') { try { el.setSelectionRange(caret, caret); } catch (e) { /* not a text field */ } } }
  }
}

/* ---------- Events ---------- */
const $app = document.getElementById('app');

$app.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.name !== undefined) { S.names[+t.dataset.name] = t.value; persist(); }
  if (t.dataset.onlineName) { ON.nm = t.value; lsSet(ONLINE_KEY + '-name', t.value); }
  if (t.dataset.joinCode) { ui.joinCode = t.value.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 4); }
});

$app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.joinCode) { e.preventDefault(); enterRoom(ui.joinCode, 'guest'); }
});

$app.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const actn = el.dataset.action;
  if (actn === 'rules-close-bg' && e.target !== el) return;
  const g = el.dataset.g !== undefined ? +el.dataset.g : null;

  switch (actn) {
    case 'rules': ui.rules = true; break;
    case 'rules-close': case 'rules-close-bg': ui.rules = false; break;
    case 'mode': ui.mode = el.dataset.m; ui.err = ''; if (ui.mode === 'online') ensureP2P(); break;
    case 'count': S.count = +el.dataset.n; persist(); break;
    case 'human': S.bots[+el.dataset.i] = false; persist(); break;
    case 'bot': S.bots[+el.dataset.i] = true; persist(); break;
    case 'set-colors': case 'set-per': case 'set-star': {
      const cfg = { C: S.colors, per: S.per, stars: S.stars };
      applySetting(cfg, actn.slice(4), +el.dataset.n);
      Object.assign(S, { colors: cfg.C, per: cfg.per, stars: cfg.stars });
      ui.err = ''; persist(); break;
    }
    case 'hints': S.hints = el.checked; persist(); return;
    case 'start': ui.err = ''; newLocalGame(); if (G) advance(); persist(); break;
    case 'quit': ui.quit = true; break;
    case 'quit-no': ui.quit = false; break;
    case 'quit-yes':
      ui.quit = false;
      if (ON.role) leaveGameRoom();
      else { stopTimer(); G = null; persist(); }
      break;
    case 'cover-ok': G.viewer = G.cover; G.cover = null; persist(); break;
    case 'roll': act('roll'); return;
    case 'sel': ui.sel = g; break;
    case 'place': ui.assign[+el.dataset.id] = ui.sel; break;
    case 'unplace': ui.assign[+el.dataset.id] = -1; break;
    case 'clear-groups': G.roll.forEach(d => { ui.assign[d.id] = -1; }); break;
    case 'confirm-groups':
      act('groups', { groups: Array.from({ length: P() }, (_, k) => G.roll.filter(d => ui.assign[d.id] === k).map(d => d.id)) });
      return;
    case 'pick': ui.chosen = g; break;
    case 'take': if (ui.chosen !== null) act('take', { g: ui.chosen }); return;
    case 'retry': {
      G.starter = (G.starter + 1) % P();
      const err = startLevel();
      ui.err = err || '';
      if (!err) advance();
      changed(); return;
    }
    case 'new':
      stopTimer();
      G = null;
      if (ON.role === 'host') { publish(); announce(); saveOnline(); } else persist();
      break;
    // Online
    case 'on-create': enterRoom(rid(4), 'host'); return;
    case 'on-join': enterRoom(ui.joinCode, 'guest'); return;
    case 'on-join-list': enterRoom(el.dataset.code, 'guest'); return;
    case 'on-count': ON.lob.n = +el.dataset.n; publish(); saveOnline(); break;
    case 'on-colors': case 'on-per': case 'on-star':
      applySetting(ON.lob, actn.slice(3), +el.dataset.n); ui.err = ''; publish(); saveOnline(); break;
    case 'on-hints': ON.lob.h = el.checked; publish(); saveOnline(); return;
    case 'on-start': hostStart(); return;
    default: return;
  }
  render();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.rules) { ui.rules = false; render(); }
});

// Guests re-check the host's connection now and then (the "disconnected" note).
setInterval(() => { if (ON.role === 'guest') render(); }, 5000);

/* ---------- Boot ---------- */
function start(data) {
  let saved = data && (data.G !== undefined || data.S) ? data : lsGet(STORE_KEY);
  if (saved) {
    if (saved.S) S = Object.assign(S, saved.S);
    // Settings saved by an older version used a star range instead of a set.
    if (!Number.isInteger(S.stars) || S.stars < 1 || S.stars > ALL_STARS) S.stars = ALL_STARS;
    delete S.smin; delete S.smax;
    if (saved.G && saved.G.players && !saved.G.online) G = saved.G;
  }
  const onl = (data && data.onl) || lsGet(ONLINE_KEY);
  const savedName = lsGet(ONLINE_KEY + '-name');
  if (onl && onl.role) ui.mode = 'online';
  if (data && data.mode) ui.mode = data.mode;
  if (G) advance();
  render();
  initOnline(onl && onl.role ? onl : (typeof savedName === 'string' ? { nm: savedName } : null));
}
window.claude?.hot?.snapshot?.(() => ({ G: G && !G.online ? G : null, S, mode: ui.mode, onl: ON.role ? { role: ON.role, code: ON.code, nm: ON.nm, G: ON.role === 'host' ? G : null, lob: ON.lob, order: ON.order } : null }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
