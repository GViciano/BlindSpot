// Colours, objectives per player and difficulty; shared by local and online setup.
function settingsHTML(pre, cfg, players) {
  const seg = (label, key, values, cur) => `<div class="field"><span class="label">${label}</span>
    <div class="seg" role="group" aria-label="${label}">${values.map(v => `<button type="button" data-action="${pre}-${key}" data-n="${v}" aria-pressed="${cur === v}">${v}</button>`).join('')}</div></div>`;
  const avail = pool(Math.max(cfg.C, minColours(players)), cfg.stars).length;
  const note = !CATALOGUE.list.length ? `<p class="err">${t('noCatalogue')}</p>`
    : avail === 0 ? `<p class="err">${t('noPool')}</p>`
    : `<p class="note">${t('poolNote', avail, players * cfg.per, CATALOGUE.bad.length)}</p>`;
  const minC = minColours(players);
  const colours = `<div class="field"><span class="label">${t('colours')}</span>
    <div class="seg" role="group" aria-label="${t('colours')}">${[3, 4, 5].map(v => `<button type="button" data-action="${pre}-colors" data-n="${v}" aria-pressed="${Math.max(cfg.C, minC) === v}" ${v < minC ? 'disabled' : ''}>${v}</button>`).join('')}</div>
    ${minC > 3 ? `<p class="note">${t('coloursNote', players, minC)}</p>` : ''}</div>`;
  return colours
    + seg(t('perPlayer'), 'per', [1, 2, 3], cfg.per)
    + `<div class="field"><span class="label">${t('difficulty')}</span>
        <div class="seg" role="group" aria-label="${t('difficulty')}">${[1, 2, 3, 4, 5].map(v => `<button type="button" data-action="${pre}-star" data-n="${v}" aria-pressed="${!!(cfg.stars & (1 << (v - 1)))}">${v}★</button>`).join('')}</div>${note}</div>
    <div class="field"><span class="label">${t('needLabel')}</span>
      <div class="stepper">
        <button type="button" class="btn" data-action="${pre}-need" data-n="-1" aria-label="${t('less')}" ${cfg.need ? '' : 'disabled'}>−</button>
        <span class="stepper-val" aria-live="polite">${cfg.need ? `${cfg.need}★` : t('needAllShort')}</span>
        <button type="button" class="btn" data-action="${pre}-need" data-n="1" aria-label="${t('more')}" ${cfg.need >= MAX_NEED ? 'disabled' : ''}>+</button>
      </div>
      <p class="note">${cfg.need ? t('needNote', cfg.need) : t('needAllNote')}</p></div>
    <div class="field"><label class="toggle"><input id="${pre}-grey" type="checkbox" data-action="${pre}-grey" ${cfg.grey ? 'checked' : ''}> ${t('greyToggle')}</label>
      <p class="note">${t('greyNote')}</p></div>`;
}

// Applies a settings button to a config object.
function applySetting(cfg, key, v) {
  if (key === 'colors') cfg.C = v;
  if (key === 'per') cfg.per = v;
  if (key === 'need') cfg.need = Math.max(0, Math.min(MAX_NEED, (cfg.need || 0) + v));
  if (key === 'star') {
    const next = cfg.stars ^ (1 << (v - 1));
    if (next) cfg.stars = next; // at least one difficulty stays selected
  }
}

function lobCfgText(lob) {
  const cf = Array.isArray(lob.cf) ? lob.cf.map(Number) : [];
  if (!(cf[0] >= 3 && cf[0] <= 5 && cf[1] >= 1 && cf[1] <= 3 && Number.isInteger(cf[2]) && cf[2] >= 1 && cf[2] <= ALL_STARS)) return '';
  return cfgText({ C: cf[0], per: cf[1], stars: cf[2], need: Number.isInteger(cf[3]) && cf[3] >= 0 && cf[3] <= MAX_NEED ? cf[3] : 0, grey: cf[4] === 1 });
}

function syncUiKey() {
  const k = stateKey();
  if (ui.key === k) return;
  const wasGroup = ui.key && ui.key.endsWith('|group');
  ui.key = k;
  ui.assign = {};
  G.roll.forEach(d => { ui.assign[d.id] = -1; });
  ui.sel = 0; ui.chosen = null; ui.hint = null; ui.pending = null;
  animate = G.phase === 'group' && !wasGroup;
}

function render() {
  const active = document.activeElement;
  const focusId = active && active.id;
  const caret = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  document.documentElement.lang = t('htmlLang');
  let html;
  if (G) { syncUiKey(); html = gameHTML(); }
  else if (ON.role) html = waitingRoomHTML();
  else html = homeHTML();
  $app.innerHTML = html + (ui.rules ? rulesHTML() : '');
  animate = false;
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) { el.focus(); if (caret !== null && typeof el.setSelectionRange === 'function') { try { el.setSelectionRange(caret, caret); } catch (e) { /* not a text field */ } } }
  }
}

/* ---------- Events ---------- */
const $app = document.getElementById('app');

$app.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.name !== undefined) { S.names[+t.dataset.name] = t.value; persist(); }
  if (t.dataset.onlineName) { ON.nm = t.value; lsSet(ONLINE_KEY + '-name', t.value); }
  if (t.dataset.joinCode) { ui.joinCode = t.value.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 4); }
});

$app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.joinCode) { e.preventDefault(); enterRoom(ui.joinCode, 'guest'); }
});

$app.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const actn = el.dataset.action;
  if (actn === 'rules-close-bg' && e.target !== el) return;
  const g = el.dataset.g !== undefined ? +el.dataset.g : null;

  switch (actn) {
    case 'lang': LANG = el.dataset.l === 'en' ? 'en' : 'es'; lsSet(LANG_KEY, LANG); ui.hint = null; break;
    case 'rules': ui.rules = true; break;
    case 'rules-close': case 'rules-close-bg': ui.rules = false; break;
    case 'mode': ui.mode = el.dataset.m; ui.err = ''; if (ui.mode === 'online') ensureP2P(); break;
    case 'count': S.count = +el.dataset.n; S.colors = Math.max(S.colors, minColours(S.count)); persist(); break;
    case 'human': S.bots[+el.dataset.i] = false; persist(); break;
    case 'bot': S.bots[+el.dataset.i] = true; persist(); break;
    case 'set-colors': case 'set-per': case 'set-star': case 'set-need': {
      const cfg = { C: S.colors, per: S.per, stars: S.stars, need: S.need || 0 };
      applySetting(cfg, actn.slice(4), +el.dataset.n);
      Object.assign(S, { colors: cfg.C, per: cfg.per, stars: cfg.stars, need: cfg.need });
      ui.err = ''; persist(); break;
    }
    case 'hints': S.hints = el.checked; persist(); return;
    case 'set-grey': S.grey = el.checked; persist(); return;
    case 'start': ui.err = ''; newLocalGame(); if (G) advance(); persist(); break;
    case 'quit': ui.quit = true; break;
    case 'quit-no': ui.quit = false; break;
    case 'quit-yes':
      ui.quit = false;
      if (ON.role) leaveGameRoom();
      else { stopTimer(); G = null; persist(); }
      break;
    case 'cover-ok': G.viewer = G.cover; G.cover = null; persist(); break;
    case 'roll': act('roll'); return;
    case 'sel': ui.sel = g; break;
    case 'place': ui.assign[+el.dataset.id] = ui.sel; break;
    case 'unplace': ui.assign[+el.dataset.id] = -1; break;
    case 'clear-groups': G.roll.forEach(d => { ui.assign[d.id] = -1; }); break;
    case 'confirm-groups':
      act('groups', { groups: Array.from({ length: P() }, (_, k) => G.roll.filter(d => ui.assign[d.id] === k).map(d => d.id)) });
      return;
    case 'pick': ui.chosen = g; break;
    case 'take': if (ui.chosen !== null) act('take', { g: ui.chosen }); return;
    case 'retry': {
      G.starter = ri(P());
      const err = startLevel();
      ui.err = err || '';
      if (!err) advance();
      changed(); return;
    }
    case 'new':
      stopTimer();
      G = null;
      if (ON.role === 'host') { publish(); announce(); saveOnline(); } else persist();
      break;
    // Online
    case 'on-create': ON.resumable = null; enterRoom(rid(4), 'host'); return;
    case 'on-resume': {
      const r = ON.resumable;
      ON.resumable = null;
      if (!r) break;
      if (typeof r.tk === 'string' && r.tk.length >= 8) { ON.tk = r.tk; ssSet(TOKEN_KEY, r.tk); }
      ON.nm = cleanName(r.nm) || ON.nm;
      enterRoom(r.code, r.role, r);
      return;
    }
    case 'on-join': ON.resumable = null; enterRoom(ui.joinCode, 'guest'); return;
    case 'on-join-list': enterRoom(el.dataset.code, 'guest'); return;
    case 'on-count': ON.lob.n = +el.dataset.n; publish(); saveOnline(); break;
    case 'on-colors': case 'on-per': case 'on-star': case 'on-need':
      applySetting(ON.lob, actn.slice(3), +el.dataset.n); ui.err = ''; publish(); saveOnline(); break;
    case 'on-hints': ON.lob.h = el.checked; publish(); saveOnline(); return;
    case 'on-grey': ON.lob.grey = el.checked; ON.lastLob = null; publish(); saveOnline(); return;
    case 'on-start': hostStart(); return;
    default: return;
  }
  render();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.rules) { ui.rules = false; render(); }
});

// Guests re-check the host's connection now and then (the "disconnected" note).
setInterval(() => { if (ON.role === 'guest') render(); }, 5000);

/* ---------- Boot ---------- */
function start(data) {
  let saved = data && (data.G !== undefined || data.S) ? data : lsGet(STORE_KEY);
  if (saved) {
    if (saved.S) S = Object.assign(S, saved.S);
    // Settings saved by an older version used a star range instead of a set.
    if (!Number.isInteger(S.stars) || S.stars < 1 || S.stars > ALL_STARS) S.stars = ALL_STARS;
    if (!Number.isInteger(S.need) || S.need < 0 || S.need > MAX_NEED) S.need = 0;
    S.grey = S.grey === true;
    delete S.smin; delete S.smax;
    if (saved.G && saved.G.players && !saved.G.online) G = saved.G;
  }
  // Resume on its own only this tab's game; a game saved by another tab becomes a button.
  const onl = (data && data.onl) || ssGet(ONLINE_KEY);
  const other = lsGet(ONLINE_KEY);
  ON.resumable = !onl && other && other.role && other.code ? other : null;
  const savedName = lsGet(ONLINE_KEY + '-name');
  if (onl && onl.role) ui.mode = 'online';
  if (data && data.mode) ui.mode = data.mode;
  if (G) advance();
  render();
  initOnline(onl && onl.role ? onl : (typeof savedName === 'string' ? { nm: savedName } : null));
}
window.claude?.hot?.snapshot?.(() => ({ G: G && !G.online ? G : null, S, mode: ui.mode, onl: ON.role ? { role: ON.role, code: ON.code, nm: ON.nm, tk: ON.tk, G: ON.role === 'host' ? G : null, lob: ON.lob, order: ON.order } : null }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
